# Gera o APK do Bora na nuvem, sem instalar Flutter no computador.
# Antes: Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL       = https://SEU-PROJETO.supabase.co
#   SUPABASE_ANON_KEY  = chave "anon public" (Settings > API no Supabase)
#   ORS_API_KEY        = token da OpenRouteService (rotas)
#   MAPBOX_TOKEN       = token público do Mapbox (busca de comércios), opcional
#   MAPS_API_KEY       = (opcional) chave do Google Maps SDK for Android.
#                        Sem ela, o app usa o mapa escuro do OpenStreetMap.
# Depois: aba Actions > "Gerar APK" > Run workflow. O APK sai em "Artifacts".
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
      - '**.md'
      - '.github/workflows/supabase-*.yml'
      - '.github/workflows/demo-*.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar a parte Android do projeto
        run: |
          mkdir -p /tmp/keep
          cp -r lib assets test pubspec.yaml /tmp/keep/
          flutter create --org br.com.bora --project-name bora --platforms android .
          rm -rf lib test
          cp -r /tmp/keep/lib /tmp/keep/assets /tmp/keep/test .
          cp /tmp/keep/pubspec.yaml .
          # O "lint vital" do Android quebra analisando o plugin do Google Maps (bug do lint).
          # Desliga só essa checagem; o código Dart continua passando pelo flutter analyze.
          if [ -f android/build.gradle.kts ]; then
            printf '\nsubprojects {\n    tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }\n}\n' >> android/build.gradle.kts
          else
            printf '\nsubprojects {\n    tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }\n}\n' >> android/build.gradle
          fi

      - name: Permissões (internet e localização) e nome do app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Bora"#' $M
          # Voz da navegação (Android 11+ precisa declarar que usa o leitor de texto)
          if grep -q '<queries>' $M; then
            sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>#' $M
          else
            sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n</manifest>#' $M
          fi
          if [ -n "$MAPS_API_KEY" ]; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.geo.API_KEY\" android:value=\"$MAPS_API_KEY\"/>\n    </application>#" $M
            echo "GOOGLE_MAPS=true" >> "$GITHUB_ENV"
            echo "Google Maps: ligado"
          else
            echo "GOOGLE_MAPS=false" >> "$GITHUB_ENV"
            echo "::notice::Sem MAPS_API_KEY: o APK usa o mapa do OpenStreetMap."
          fi
          grep -v 'API_KEY' $M
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Usar a chave fixa de assinatura de teste
        run: |
          mkdir -p ~/.android
          cp android-dev/bora-dev.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E 'SHA1:'

      - run: flutter pub get
      - name: Gerar o ícone do app
        run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Conferir a busca do Mapbox (Casa Doce, 112 Sul)
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "$MAPBOX_TOKEN" ]; then echo "Sem MAPBOX_TOKEN: busca fica só na OpenRouteService"; exit 0; fi
          curl -s "https://api.mapbox.com/search/searchbox/v1/forward?q=Casa%20Doce%20112%20Sul&language=pt&country=BR&limit=5&bbox=-48.7,-16.5,-47.0,-15.2&access_token=$MAPBOX_TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('message') or '\n'.join('  ' + f['properties'].get('name','') + ' | ' + str(f['properties'].get('full_address') or f['properties'].get('place_formatted')) for f in d.get('features', [])) or '  nada encontrado')" || true
      - name: Conferir o estilo do mapa
        run: flutter test test/map_theme_test.dart

      - name: Gerar APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=ORS_API_KEY=${{ secrets.ORS_API_KEY }} \
            --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }} \
            --dart-define=GOOGLE_MAPS=$GOOGLE_MAPS

      - uses: actions/upload-artifact@v4
        with:
          name: bora-apk
          path: build/app/outputs/flutter-apk/app-release.apk
