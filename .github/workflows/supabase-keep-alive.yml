# Faz uma chamada leve ao Supabase a cada 3 dias para o projeto gratuito não pausar.
# Usa os mesmos secrets do "Gerar APK": SUPABASE_URL e SUPABASE_ANON_KEY.
name: Supabase keep-alive

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 */3 * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar keep_alive()
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
